<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="{{url_for('static', filename='login.css') }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Vaultify Password Manager</title>
  <meta name="description" content="Log in to your Vaultify account to access your encrypted password vault safely and securely.">
  <meta name="author" content="Harshvardhan">
</head>

<body>
  <h2>Welcome to Login Page</h2>
 {% if errors %}
  <p style="color: red; font-size: 13px; text-align: center; margin-bottom: 10px;">{{ errors }}</p>
{% endif %}
  <form action="/login" method="POST">
    <label for="email">E-Mail 📧</label>
    <input type="email" name="email" id="email" placeholder="Enter Your Email Address" required>
    <label for="password">Password 🔒</label>
    <input type="password" name="password" id="password" placeholder="Enter Your Password" required>
    <button type="submit">Login</button>
    <p>Don't have an account?
    <a href="/signup">Sign Up</a>
    </p>
  </form>
 <p class="creater">Vaultify - Created by Harshvardhan Chauhan</p>
</body>

</html>
